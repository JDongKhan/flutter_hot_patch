<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>flutter_hot · App 高保真交互原型</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:#e9ecf2;
  background-image:radial-gradient(900px 520px at 50% -18%,#d9e6fd 0,rgba(233,236,242,0) 72%);
  font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,"Segoe UI",Roboto,sans-serif;
  color:#171a21;display:flex;justify-content:center;align-items:flex-start;padding:26px 12px 48px;
}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.hint{font-size:13px;color:#697284;text-align:center;line-height:1.6;max-width:520px}
.hint b{color:#2b6cf6}

/* ---------- 手机外壳 ---------- */
.phone{width:390px;height:844px;background:linear-gradient(180deg,#242833,#0b0d12);border-radius:56px;padding:13px;
  box-shadow:0 44px 90px -24px rgba(16,28,56,.5),0 0 0 1.5px rgba(255,255,255,.09) inset;position:relative;flex:0 0 auto}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#F3F5F8;display:flex;flex-direction:column}
.island{position:absolute;top:19px;left:50%;transform:translateX(-50%);width:106px;height:28px;border-radius:18px;background:#090b0f;z-index:80}
.statusbar{flex:0 0 auto;height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 5px;
  font-size:13px;font-weight:650;color:#0d1117;position:relative;z-index:40}
.sb-icons{display:flex;gap:5px;align-items:center}
.viewport{position:relative;flex:1;min-height:0;overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.scroll::-webkit-scrollbar{width:0;height:0}
.tabbar{flex:0 0 auto;height:74px;display:flex;padding:8px 6px 0;background:rgba(255,255,255,.95);
  backdrop-filter:blur(18px);border-top:1px solid #e8ebf0;position:relative;z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9aa1ad;cursor:pointer;transition:color .18s}
.tab span{font-size:10.5px;font-weight:550}
.tab.active{color:#0E7AFB}
.tab svg{width:24px;height:24px}
.home-indicator{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:132px;height:5px;border-radius:3px;background:#101319;opacity:.85;z-index:45}

/* ---------- 通用 ---------- */
.card{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.pad{padding:0 12px}
.muted{color:#8b909a}
.press{transition:transform .12s ease,opacity .12s ease}
.press:active{transform:scale(.985);opacity:.9}
.price{color:#FF5A36;font-weight:700}
.chev{color:#c3c8d2;font-size:15px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px}
.sec-title{font-size:17px;font-weight:700;letter-spacing:.2px}
.sec-more{font-size:12.5px;color:#8b909a;display:flex;align-items:center;gap:2px}

/* ---------- 首页 ---------- */
.home-head{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0E7AFB 0%,#3B93FF 62%,#F3F5F8 100%);
  padding:6px 14px 16px;border-radius:0 0 20px 20px}
.home-top{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:12px}
.home-loc{font-size:15px;font-weight:650;display:flex;align-items:center;gap:4px}
.searchbar{display:flex;align-items:center;gap:8px;height:40px;background:#fff;border-radius:20px;padding:0 14px;
  box-shadow:0 6px 16px -6px rgba(10,40,90,.35);cursor:pointer}
.searchbar .ph-txt{font-size:13.5px;color:#a3a9b4}
.bell{width:30px;height:30px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.bell i{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#FF5A36;border:1.5px solid #3B93FF}

.banner-wrap{margin-top:-4px;padding-top:4px}
.banner{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 12px 6px;scrollbar-width:none}
.banner::-webkit-scrollbar{display:none}
.slide{flex:0 0 calc(100% - 8px);scroll-snap-align:center;height:150px;border-radius:16px;overflow:hidden;position:relative;cursor:pointer;
  box-shadow:0 8px 20px -12px rgba(20,40,90,.45)}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;color:#fff;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.62));font-size:15px;font-weight:650}
.slide .cap em{display:block;font-style:normal;font-size:11.5px;font-weight:400;opacity:.85;margin-top:2px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:6px}
.dots i{width:5px;height:5px;border-radius:3px;background:#c8cdd8;transition:all .2s}
.dots i.on{width:14px;background:#0E7AFB}

.grid9{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 0;margin:12px;padding:16px 6px}
.g9{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.g9 .ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.g9 .lbl{font-size:11.5px;color:#4d5462;font-weight:500}

.ad{margin:0 12px;height:88px;border-radius:16px;overflow:hidden;position:relative;cursor:pointer;
  box-shadow:0 8px 20px -14px rgba(20,40,90,.5)}
.ad img{width:100%;height:100%;object-fit:cover;display:block}
.ad .badge{position:absolute;top:8px;left:8px;font-size:10px;color:#fff;background:rgba(0,0,0,.42);padding:2px 6px;border-radius:6px}
.ad .cap{position:absolute;left:12px;bottom:10px;color:#fff;font-size:14px;font-weight:650;text-shadow:0 1px 6px rgba(0,0,0,.5)}

.spots{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 18px}
.spot{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px -6px rgba(20,40,90,.25);cursor:pointer}
.spot .im{height:98px;position:relative}
.spot .im img{width:100%;height:100%;object-fit:cover;display:block}
.spot .im .tag{position:absolute;left:8px;top:8px;font-size:10px;color:#fff;background:rgba(14,122,251,.9);padding:2px 7px;border-radius:8px}
.spot .bd{padding:9px 10px 11px}
.spot .tt{font-size:13.5px;font-weight:650;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot .ss{font-size:11px;color:#8b909a;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot .pr{margin-top:7px;font-size:12px;display:flex;align-items:baseline;justify-content:space-between}
.spot .pr .price{font-size:15px}
.spot .pr .sold{font-size:10.5px;color:#a3a9b4}

/* ---------- 社区 ---------- */
.tab-head{padding:4px 0 8px;background:#fff;border-bottom:1px solid #eef1f5;position:sticky;top:0;z-index:20}
.seg{display:flex;justify-content:center;gap:34px}
.seg .sg{font-size:16.5px;color:#7c828e;padding:6px 2px;position:relative;cursor:pointer;font-weight:550}
.seg .sg.on{color:#171a21;font-weight:750}
.seg .sg.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:22px;height:3px;border-radius:2px;background:#0E7AFB}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.rescard{flex:0 0 138px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px -6px rgba(20,40,90,.25);cursor:pointer}
.rescard .im{height:82px}
.rescard .im img{width:100%;height:100%;object-fit:cover;display:block}
.rescard .tt{font-size:12.5px;font-weight:600;padding:8px 9px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rescard .tt em{font-style:normal;display:block;font-weight:400;font-size:10.5px;color:#8b909a;margin-top:2px}

.filterbar{display:flex;align-items:center;gap:18px;padding:12px 16px 10px;position:relative}
.fb{font-size:13.5px;color:#5c6270;cursor:pointer;display:flex;align-items:center;gap:3px}
.fb.on{color:#0E7AFB;font-weight:650}
.fb .caret{font-size:9px;transition:transform .2s}
.fb.open .caret{transform:rotate(180deg)}
.fb-filter{margin-left:auto;font-size:12.5px;color:#4d5462;display:flex;align-items:center;gap:5px;
  border:1px solid #e2e6ee;border-radius:14px;padding:4px 10px;background:#fff;cursor:pointer}
.fb-filter.on{border-color:#0E7AFB;color:#0E7AFB;background:#EAF3FF}

.posts{padding:2px 12px 18px;display:flex;flex-direction:column;gap:10px}
.post{display:flex;gap:11px;background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 10px -7px rgba(20,40,90,.28);cursor:pointer}
.post .im{width:86px;height:86px;border-radius:10px;overflow:hidden;flex:0 0 auto}
.post .im img{width:100%;height:100%;object-fit:cover;display:block}
.post .bd{flex:1;min-width:0;display:flex;flex-direction:column}
.post .tt{font-size:14px;font-weight:650;line-height:1.4}
.post .ss{font-size:11.5px;color:#8b909a;margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .ft{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:#a3a9b4}
.post .who{display:flex;align-items:center;gap:4px}
.dotav{width:15px;height:15px;border-radius:50%;background:linear-gradient(135deg,#9ec2ff,#c9b6ff)}

/* 下拉筛选面板 */
.dd-panel{position:absolute;left:12px;right:12px;background:#fff;border-radius:16px;padding:14px 14px 12px;
  box-shadow:0 18px 44px -12px rgba(16,34,70,.35);pointer-events:auto;animation:drop .2s ease}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dd-scrim{position:absolute;inset:0;background:rgba(14,20,34,.3);pointer-events:auto;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dd-grp{margin-bottom:12px}
.dd-grp h4{margin:0 0 8px;font-size:12px;color:#8b909a;font-weight:600;letter-spacing:.3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12.5px;color:#4d5462;background:#F3F5F8;border-radius:14px;padding:6px 13px;cursor:pointer;transition:all .15s}
.chip.on{background:#EAF3FF;color:#0E7AFB;font-weight:650;box-shadow:0 0 0 1px #0E7AFB inset}
.dd-actions{display:flex;gap:10px;border-top:1px solid #eef1f5;padding-top:12px}
.btn{flex:1;height:40px;border-radius:20px;border:0;font-size:14.5px;font-weight:650;cursor:pointer;font-family:inherit}
.btn.ghost{background:#F3F5F8;color:#4d5462}
.btn.primary{background:#0E7AFB;color:#fff}
.btn.accent{background:#FF5A36;color:#fff}

/* ---------- 订单 ---------- */
.status-tabs{display:flex;gap:20px;overflow-x:auto;padding:12px 16px 10px;background:#fff;border-bottom:1px solid #eef1f5;
  scrollbar-width:none;position:sticky;top:0;z-index:20}
.status-tabs::-webkit-scrollbar{display:none}
.st{font-size:13.5px;color:#7c828e;white-space:nowrap;cursor:pointer;position:relative;padding-bottom:6px}
.st.on{color:#171a21;font-weight:700}
.st.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:18px;height:3px;border-radius:2px;background:#0E7AFB}
.order{background:#fff;border-radius:14px;margin:12px 12px 0;padding:12px;box-shadow:0 2px 10px -7px rgba(20,40,90,.28);cursor:pointer}
.order-h{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:#98a0ac}
.order-h .stat{color:#0E7AFB;font-weight:650}
.order-h .stat.done{color:#9aa1ad}
.order-h .stat.warn{color:#FF5A36}
.order-b{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed #eef1f5}
.order-b .im{width:62px;height:62px;border-radius:10px;overflow:hidden;flex:0 0 auto}
.order-b .im img{width:100%;height:100%;object-fit:cover;display:block}
.order-b .bd{flex:1;min-width:0}
.order-b .tt{font-size:13.5px;font-weight:650}
.order-b .ss{font-size:11px;color:#8b909a;margin-top:5px}
.order-b .qt{font-size:11px;color:#a3a9b4;margin-top:5px;text-align:right}
.order-f{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #f2f4f8}
.order-f .sum{font-size:12px;color:#5c6270}
.order-f .sum b{font-size:16px}
.order-f .acts{display:flex;gap:8px}
.mini{font-size:12px;padding:6px 14px;border-radius:14px;border:1px solid #dfe4ec;color:#4d5462;background:#fff;cursor:pointer;font-family:inherit}
.mini.primary{background:#0E7AFB;border-color:#0E7AFB;color:#fff;font-weight:600}

/* ---------- 我的 ---------- */
.mine-head{background:linear-gradient(160deg,#0E7AFB,#4E9DFF 60%,#8CC2FF);padding:14px 18px 26px;border-radius:0 0 22px 22px;
  display:flex;align-items:center;gap:14px;cursor:pointer;position:relative}
.avatar{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2.5px solid rgba(255,255,255,.85);flex:0 0 auto}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.mine-info{flex:1;color:#fff}
.mine-info .nm{font-size:18px;font-weight:750}
.mine-info .ph{font-size:12px;opacity:.88;margin-top:4px}
.mine-info .login-tip{font-size:12px;opacity:.92;margin-top:5px}
.mine-head .arrow{color:rgba(255,255,255,.9);font-size:18px}
.stats{display:flex;background:#fff;border-radius:16px;margin:-16px 14px 0;padding:14px 0;box-shadow:0 8px 22px -14px rgba(20,40,90,.4);position:relative;z-index:2}
.stat{flex:1;text-align:center;cursor:pointer}
.stat b{display:block;font-size:17px;font-weight:750}
.stat span{font-size:11px;color:#8b909a;margin-top:3px;display:block}
.menu{background:#fff;border-radius:16px;margin:14px 14px 0;overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;border-bottom:1px solid #f2f4f8}
.mrow:last-child{border-bottom:0}
.mrow .mi{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px}
.mrow .mt{flex:1;font-size:14.5px;font-weight:550}
.logout{margin:18px 14px 20px;height:46px;border-radius:23px;background:#fff;color:#FF5A36;font-size:15px;font-weight:650;
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 10px -7px rgba(20,40,90,.3)}

/* ---------- 二级页 ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:6px 14px 12px;background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid #eef1f5}
.back{width:34px;height:34px;border-radius:50%;background:#F3F5F8;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.topbar .tt{font-size:16.5px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.searchpage{display:flex;align-items:center;gap:8px;height:38px;background:#F3F5F8;border-radius:19px;padding:0 14px;flex:1}
.searchpage input{border:0;background:transparent;outline:0;font-size:14px;flex:1;font-family:inherit;color:#171a21}
.hero{height:230px;position:relative}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .back{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.9)}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 16px;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.6))}
.hero .cap h1{margin:0;font-size:21px;font-weight:750}
.hero .cap p{margin:6px 0 0;font-size:12.5px;opacity:.9}
.blk{background:#fff;border-radius:16px;margin:12px;padding:14px 16px}
.blk h3{margin:0 0 10px;font-size:15px;font-weight:700}
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{font-size:11.5px;color:#0E7AFB;background:#EAF3FF;border-radius:8px;padding:3px 9px}
.tag.g{color:#0a9a63;background:#E6F8F0}
.ptxt{font-size:13px;line-height:1.85;color:#4d5462}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;color:#4d5462}
.kv b{color:#171a21;font-weight:600}
.timeline{padding-left:4px}
.tl{display:flex;gap:10px;font-size:12.5px;color:#8b909a;padding:5px 0}
.tl i{width:8px;height:8px;border-radius:50%;background:#dfe4ec;margin-top:5px;flex:0 0 auto}
.tl.on{color:#171a21;font-weight:600}
.tl.on i{background:#0E7AFB}
.cta{display:flex;align-items:center;gap:12px;padding:12px 16px 16px;background:#fff;border-top:1px solid #eef1f5}
.cta .cprice{font-size:13px;color:#5c6270}
.cta .cprice b{font-size:22px;color:#FF5A36}
.cta .btn{flex:1}
.author{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff}
.author .ava{width:38px;height:38px;border-radius:50%;overflow:hidden}
.author .ava img{width:100%;height:100%;object-fit:cover}
.author .an{font-size:14px;font-weight:650}
.author .as{font-size:11px;color:#8b909a;margin-top:2px}
.follow{margin-left:auto;font-size:12.5px;color:#fff;background:#0E7AFB;border-radius:14px;padding:6px 16px;cursor:pointer}
.login-wrap{padding:32px 26px}
.login-logo{width:66px;height:66px;border-radius:20px;background:linear-gradient(140deg,#0E7AFB,#7FB6FF);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px}
.login-title{text-align:center;font-size:20px;font-weight:750}
.login-sub{text-align:center;font-size:12.5px;color:#8b909a;margin-top:7px}
.field{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:0 14px;height:50px;margin-top:14px}
.field input{border:0;outline:0;background:transparent;font-size:15px;flex:1;font-family:inherit;color:#171a21}
.field .code-btn{font-size:13px;color:#0E7AFB;font-weight:600;cursor:pointer;white-space:nowrap}
.field .prefix{font-size:14px;color:#4d5462;font-weight:600}
.agree{font-size:11px;color:#8b909a;margin-top:16px;text-align:center;line-height:1.7}
.web-url{font-size:11px;color:#98a0ac;background:#F3F5F8;border-radius:10px;padding:8px 12px;margin:12px;word-break:break-all;font-family:ui-monospace,Menlo,monospace}
.web-body{background:#fff;border-radius:16px;margin:0 12px 16px;padding:18px 16px}
.web-body h2{font-size:17px;margin:0 0 12px}
.web-body p{font-size:13.5px;line-height:1.9;color:#4d5462;margin:0 0 12px}
.web-body .bannerimg{height:130px;border-radius:12px;overflow:hidden;margin-bottom:14px}
.web-body .bannerimg img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- 其他 ---------- */
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,26,40,.9);color:#fff;
  font-size:13px;padding:10px 18px;border-radius:22px;pointer-events:none;animation:toastIn .22s ease;z-index:99;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.empty{text-align:center;color:#a3a9b4;font-size:13px;padding:48px 0}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="island"></div>
    <div class="screen">
      <div class="statusbar">
        <span>9:41</span>
        <span class="sb-icons">▮▮▮ ᯤ 100%</span>
      </div>
      <div class="viewport">
        <div class="scroll" id="app"></div>
      </div>
      <div class="tabbar" id="tabbar"></div>
      <div class="overlay" id="overlay"></div>
      <div class="home-indicator"></div>
    </div>
  </div>
  <p class="hint">高保真交互原型 · 点击 <b>任意卡片 / 入口 / 头像</b> 查看跳转，社区页点「筛选」可从顶部下拉过滤列表</p>
</div>

<script>
/* ============ 图片资源（Trae 文生图，带 CSS 兜底） ============ */
function img(p, s){ return 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=' + p + '&image_size=' + s; }
const IMG = {
  banner1: img('aerial%20view%20of%20tropical%20island%20beach%20turquoise%20water%20travel%20photography','landscape_16_9'),

/* ============ 主渲染 ============ */
function render(){
  const c = cur();
  let html = '';
  if(c.screen === 'tab'){
    if(state.tab==='home') html = homeHtml();
    else if(state.tab==='community') html = communityHtml();
    else if(state.tab==='orders') html = ordersHtml();
    else html = mineHtml();
  } else if(c.screen==='search') html = searchHtml();
  else if(c.screen==='spot') html = spotHtml(c.arg);
  else if(c.screen==='post') html = postHtml(c.arg);
  else if(c.screen==='resource') html = resourceHtml(c.arg);
  else if(c.screen==='orderDetail') html = orderDetailHtml(c.arg);
  else if(c.screen==='login') html = loginHtml();
  else if(c.screen==='webview') html = webviewHtml(c.arg || '详情');
  else if(c.screen==='orders'){ state.tab='orders'; html = ordersHtml(); }

  const app = $('app');
  app.innerHTML = html;
  app.scrollTop = 0;
  $('tabbar').style.display = state.stack.length ? 'none' : 'flex';
  $('tabbar').innerHTML = tabbarHtml();
  renderOverlay();
  afterRender();
}

function renderOverlay(){
  const ov = $('overlay');
  let html = '';
  if(state.filterOpen) html += filterPanelHtml();
  if(state.toast) html += '<div class="toast">'+esc(state.toast)+'</div>';
  ov.innerHTML = html;
  ov.style.pointerEvents = 'none';
}

function afterRender(){
  // 轮播指示点
  const b = $('banner'), d = $('dots');
  if(b && d){
    b.addEventListener('scroll', ()=>{
      const i = Math.round(b.scrollLeft / (b.scrollWidth / BANNERS.length));
      [...d.children].forEach((el,k)=>el.className = (k===i?'on':''));
    }, {passive:true});
  }
  // 搜索框聚焦
  const si = $('searchinput');
  if(si) setTimeout(()=>si.focus(), 60);
  // 筛选面板定位
  if(state.filterOpen){
    const bar = $('filterbar'), panel = $('ddpanel');
    if(bar && panel){
      const br = bar.getBoundingClientRect(), sr = document.querySelector('.screen').getBoundingClientRect();
      state.filterTop = br.bottom - sr.top + 4;
      panel.style.top = state.filterTop + 'px';
    }
  }
}

/* ============ 事件 ============ */
document.querySelector('.screen').addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  if(a === 'tab'){ setTab(el.dataset.tab); }
  else if(a === 'open'){ 
    const scr = el.dataset.screen;
    if(scr==='orders'){ state.tab='orders'; state.stack=[]; render(); }
    else go(scr, el.dataset.arg);
  }
  else if(a === 'back'){ back(); }
  else if(a === 'community-tab'){ state.communityTab = el.dataset.tab; render(); }
  else if(a === 'toggle-filter'){
    if(!state.filterOpen){
      const bar = $('filterbar');
      if(bar){
        const br = bar.getBoundingClientRect(), sr = document.querySelector('.screen').getBoundingClientRect();
        state.filterTop = br.bottom - sr.top + 4;
      }
    }
    state.filterOpen = !state.filterOpen;
    render();
  }
  else if(a === 'pick-filter'){
    state.filters[el.dataset.key] = el.dataset.value;
    render();
    if(state.filterOpen){ /* 保持面板打开 */ }
  }
  else if(a === 'reset-filter'){
    state.filters = {sort:'综合',type:'全部',dist:'不限',price:'不限'};
    state.filterOpen = false;
    render();
    showToast('已重置筛选条件');
  }
  else if(a === 'order-status'){ state.orderStatus = el.dataset.value; render(); }
  else if(a === 'toast'){ showToast(el.dataset.msg || '操作成功'); }
  else if(a === 'search-go'){
    const kw = el.dataset.value && el.dataset.value !== '搜索' ? el.dataset.value : (($('searchinput')||{}).value || '');
    showToast('搜索：' + (kw || '全部'));
  }
  else if(a === 'login'){
    const ph = ($('loginphone')||{}).value || '';
    if(ph.replace(/\D/g,'').length < 11){ showToast('请输入 11 位手机号'); return; }
    showToast('登录成功，欢迎回来');
    setTimeout(back, 700);
  }
}, false);

render();
</script>
