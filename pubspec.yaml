name: flutter_hot
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  # 下拉刷新（easy_refresh 能力）：宿主侧桥接见
  # hot_patch/lib/src/js_ui/capabilities/easy_refresh/。
  easy_refresh: ^3.4.0
  # 磁盘缓存网络图（cached_network_image 能力）：宿主侧桥接见
  # hot_patch/lib/src/js_ui/capabilities/cached_network_image/。
  cached_network_image: ^3.4.1
  hot_patch:
    path: packages/hot_patch
  hot_patch_annotations:
    path: packages/hot_patch_annotations

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  build_runner: ^2.4.13
  hot_patch_generator:
    path: packages/hot_patch_generator
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
