name: flutter_hot_example
description: "示例 App：注解组件 → JS 热更渲染 Demo（原生 vs JS 热更对比）。"
publish_to: 'none'
version: 1.0.0+1
# 属于仓库根的 pub workspace（见根 pubspec.yaml 的 workspace 列表）。
resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  # GetX 状态管理（DI / GetBuilder / Obx）：JS 侧实现见宿主 js/get.js。
  get: ^4.6.6
  # 下拉刷新（easy_refresh）：三方组件，自定义能力示例——宿主桥接见
  # example/lib/custom/easy_refresh/，JS 见 js/easy_refresh.js。
  easy_refresh: ^3.4.0
  # 磁盘缓存网络图（cached_network_image 能力）：宿主侧桥接见
  # dynamic_flutter/lib/src/js_ui/capabilities/cached_network_image/。
  cached_network_image: ^3.4.1
  # 曝光/可见性检测：自定义能力示例（example/lib/custom/visibility_detector/），
  # 不在 dynamic_flutter 内建能力里。
  visibility_detector: ^0.4.0+2
  # 模块化基座包（网络请求 / 工具类）：独立 Dart 包，跨包引用用于验证跨包翻译。
  hot_module_base:
    path: ../module/hot_module_base
  # 模拟三方库的 MethodChannel 插件（A：设备信息 / B：原生计数）。
  hot_plugin_device_info:
    path: ../module/hot_plugin_device_info
  hot_plugin_counter:
    path: ../module/hot_plugin_counter
  dynamic_flutter:
    path: ../packages/dynamic_flutter
  dynamic_flutter_annotations:
    path: ../packages/dynamic_flutter_annotations
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  dio: ^5.11.1
  package_info_plus: ^10.2.2
  uuid: ^4.6.0
  waterfall_flow: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  build_runner: ^2.4.13
  dynamic_flutter_generator:
    path: ../packages/dynamic_flutter_generator
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 本地示例图片（替代原先 images.unsplash.com 网络图，避免离线/弱网时加载失败）。
  assets:
    - assets/images/
    # assets 覆盖 demo 的 JSON（补丁包同名文件优先，见 AssetOverrideDetail）。
    - assets/data/
    # mock 接口的离线副本：release 读不到 127.0.0.1 的 mock 服务，改读这里的
    # json（内容与 tool/mock/ 同构，新增接口时两边同步）。
    - assets/mock/
    - assets/mock/app/
    - assets/mock/app/home/
    - assets/mock/app/orders/
