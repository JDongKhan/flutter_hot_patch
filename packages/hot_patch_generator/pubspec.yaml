name: hot_patch_generator
description: "Build-time generator that statically translates @PatchEntry-annotated Flutter widgets into matching JS modules (widget factories + component classes) for the hot_patch runtime."
version: 0.3.0
# 属于仓库根的 pub workspace（见根 pubspec.yaml 的 workspace 列表）。
resolution: workspace
# pub.dev 溯源信息。
repository: https://github.com/JDongKhan/flutter_hot_patch

environment:
  sdk: ^3.11.5

dependencies:
  analyzer: ^7.0.0
  build: ^2.4.1
  # patch 清单（patch/manifest.json）里资源的内容 hash：sha256
  crypto: ^3.0.0
  # 扫全包 dart 源（BuildStep.findAssets）需要 Glob
  glob: ^2.1.2

dev_dependencies:
  # 与根 workspace 内的 flutter_lints ^6.0.0（传递依赖 lints ^6.0.0）保持一致，
  # 否则同一份解析无法同时满足两处约束。
  lints: ^6.0.0