name: hot_patch_generator
description: 读取 @PatchEntry注解，把 Flutter widget 静态翻译为与源文件同名的 JS 模块（包级 widget 工厂 + 组件类），供 hot_patch 运行时热更渲染。
version: 0.1.0
# 发布前填写（pub.dev 会展示，用于溯源；缺失只会有警告）：
# repository: https://github.com/<your-org>/flutter_hot

environment:
  sdk: ^3.11.5

dependencies:
  analyzer: ^7.0.0
  build: ^2.4.1
  # patch 清单（patch/manifest.json）里资源的内容 hash：sha256
  crypto: ^3.0.0
  # 扫全包 dart 源（BuildStep.findAssets）需要 Glob
  glob: ^2.1.2

dev_dependencies:
  lints: ^5.0.0