builders:
  # 组件 builder：lib/ 下含 @UIComponent 注解的 .dart → .component.js
  ui_component:
    import: "package:ui_component_generator/builder.dart"
    builder_factories: ["componentBuilder"]
    build_extensions:
      "^lib/{{}}.dart":
        # 直接镜像 lib 源码路径（lib/a/b.dart → assets/a/b.component.js）：
        # 不预设 components 之类固定目录名，源码目录怎么组织产物就怎么落。
        - "assets/{{}}.component.js"
    auto_apply: dependents
    build_to: source

  # widget 模块 builder：每个 widget 类型 → 一个共享 JS 模块
  # assets/<package>/<Type>.js（如 flutter/Text.js、provider/ChangeNotifierProvider.js）。
  # 这类产物是 package 级（与 lib 源码目录无关），故直接落在 assets 根下；
  # 输出名无法按构建期发现的类型动态生成，故全部挂在种子输入 lib/js_widgets.dart 下；
  # 类型清单由 builder 的 buildExtensions getter 从 translator 注册表静态推导。
  ui_widget:
    import: "package:ui_component_generator/builder.dart"
    builder_factories: ["widgetModuleBuilder"]
    # 真正的产物清单来自 WidgetModuleBuilder.buildExtensions（由 translator 注册表
    # 推导）；build_runner 对 builder_factories 返回的 Builder 采用其自身 getter，
    # 本段落仅为 BuilderDefinition 的语法占位（build_config 要求该键非空），
    # 不参与计算——因此这里填什么包名都无所谓，勿在此维护清单。
    build_extensions:
      "^lib/js_widgets.dart":
        - "assets/flutter/AppBar.js"
    auto_apply: dependents
    build_to: source

  # 模型 builder：lib/model/ 下的 .dart → .model.js（export class 供组件 import）
  ui_model:
    import: "package:ui_component_generator/builder.dart"
    builder_factories: ["modelBuilder"]
    build_extensions:
      "^lib/model/{{}}.dart":
        # 同样镜像 lib 路径（lib/model/user.dart → assets/model/user.model.js）。
        - "assets/model/{{}}.model.js"
    auto_apply: dependents
    build_to: source
