builders:
  # 组件/模型 builder：lib/ 下的 .dart → 同名 .js。按内容分流（与目录无关）：
  # 含 @UIComponent 的出组件产物，否则出模型/单例产物；文件名与 dart 源文件一致。
  ui_component:
    import: "package:ui_component_generator/builder.dart"
    builder_factories: ["componentBuilder"]
    build_extensions:
      "^lib/{{}}.dart":
        # 直接镜像 lib 源码路径（lib/a/b.dart → assets/a/b.js）：
        # 不预设目录名、不区分组件/模型，产物文件名与 dart 源文件一致。
        - "assets/{{}}.js"
    auto_apply: dependents
    build_to: source

  # package 模块 builder：**每个 package → 一个共享 JS 文件** assets/<package>.js
  # （如 flutter.js 内含 __h 与全部 flutter widget 工厂、provider.js 内含 provider
  # 逻辑组件）。这类产物是 package 级（与 lib 源码目录无关），故直接落在 assets 根下；
  # 输出名无法按构建期发现的类型动态生成，故全部挂在种子输入 lib/js_widgets.dart 下；
  # 包清单/类型清单由 builder 的 buildExtensions getter 从 translator 注册表静态推导。
  ui_widget:
    import: "package:ui_component_generator/builder.dart"
    builder_factories: ["widgetModuleBuilder"]
    # 注意：build_runner 计算产物时用的是**实例化 Builder 的 buildExtensions
    # getter**（本 builder 由 _registeredWidgetPackages 推导出 assets/<package>.js
    # 清单，如 flutter.js + provider.js），并不读取下面这段的输出列表；
    # yaml 里的 build_extensions 只在 `build_runner doctor` 校验输入扩展名 key。
    # 但 build_config 强制 BuilderDefinition 提供非空 build_extensions，故保留一条
    # 占位输入键即可——输出列表填什么都不影响产物，勿在此维护清单。
    build_extensions:
      "^lib/js_widgets.dart":
        - "assets/flutter.js"
    auto_apply: dependents
    build_to: source
