builders:
  # 组件/模型 builder：lib/ 下的 .dart → 同名 .js。按内容分流（与目录无关）：
  # 含 @UIComponent 的出组件产物，否则出模型/单例产物；文件名与 dart 源文件一致。
  ui_component:
    import: "package:ui_component_generator/builder.dart"
    builder_factories: ["componentBuilder"]
    build_extensions:
      "^lib/{{}}.dart":
        # 直接镜像 lib 源码路径（lib/a/b.dart → patch/a/b.js）：
        # 不预设目录名、不区分组件/模型，产物文件名与 dart 源文件一致。
        - "patch/{{}}.js"
    auto_apply: dependents
    build_to: source

  # package 模块 builder：**每个 package → 一个共享 JS 文件** patch/<package>.js
  # （如 flutter.js 内含 __h 与全部 flutter widget 工厂、provider.js 内含 provider
  # 逻辑组件）。这类产物是 package 级（与 lib 源码目录无关），故直接落在 patch 根下；
  # 输出名无法按构建期发现的类型动态生成，故全部挂在种子输入 lib/js_widgets.dart 下；
  # 包清单/类型清单由 builder 的 buildExtensions getter 从 translator 注册表静态推导。
  #
  # 种子文件路径可配置：使用方在自己的 build.yaml 里用
  # `options: { seed_file: <path> }` 覆盖（默认 lib/js_widgets.dart）。
  # 注意该种子文件是必需项——使用方必须在包内提供它，否则不产出 package 模块。
  ui_widget:
    import: "package:ui_component_generator/builder.dart"
    builder_factories: ["widgetModuleBuilder"]
    # 注意：build_runner 计算产物时用的是**实例化 Builder 的 buildExtensions
    # getter**（本 builder 由 _registeredWidgetPackages 推导出 patch/<package>.js
    # 清单，如 flutter.js + provider.js），并不读取下面这段的输出列表；
    # yaml 里的 build_extensions 只在 `build_runner doctor` 校验输入扩展名 key。
    # 但 build_config 强制 BuilderDefinition 提供非空 build_extensions，故保留一条
    # 占位输入键即可——输出列表填什么都不影响产物，勿在此维护清单。
    build_extensions:
      "^lib/js_widgets.dart":
        - "patch/flutter.js"
    auto_apply: dependents
    build_to: source

  # 宿主注入注册 builder：扫描全包 @HostInjected 方法，把 registerHostMethod
  # 的注册调用集中生成到**一个 Dart 文件** lib/generated/host_methods.dart，
  # 使用方在 main() 里调用一次 registerHostMethods() 即可。
  #
  # 与上面两个 builder 的区别：它们的产物是 patch/ 下的 **JS**（运行期被 JS
  # 引擎加载），本 builder 的产物是**参与编译的 Dart 源码**，故单独一个 builder。
  # 输入是包根伪资产 $package$（build_runner 支持的「整包」输入键，无需种子
  # 文件）；产物路径固定，不随发现的注解动态变化。
  #
  # 注册目标默认指向配套运行时（package:hot_patch/hot_patch.dart +
  # JsRuntimeManager.registerHostMethod），**使用方无需任何配置**；
  # 仅当换用别的运行时实现时才在自己的 build.yaml 里覆盖（均为可选项）：
  #   options:
  #     register_import: "package:<runtime>/<runtime>.dart"
  #     register_call: "<Runtime>.registerHostMethod"
  ui_host_register:
    import: "package:ui_component_generator/builder.dart"
    builder_factories: ["hostRegisterBuilder"]
    build_extensions:
      "$package$":
        - "lib/generated/host_methods.dart"
    auto_apply: dependents
    build_to: source
