name: hot_patch
description: "热更新运行时：加载 codegen 生成的 JS 组件补丁（.component.js + schema），由 JS 驱动渲染与逻辑，渲染仍发生在原生 Flutter 侧。"
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_js: ^0.8.7
  # 网络补丁包：http(s):// zip 下载解压（RemoteAssetLoader）
  archive: ^3.6.1
  path_provider: ^2.1.4
