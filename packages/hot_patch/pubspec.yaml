name: hot_patch
description: Flutter 热更新运行时：加载构建期生成的 JS 补丁渲染组件、由 JS 驱动逻辑，渲染仍在原生 Flutter 侧。
version: 0.1.0
# 发布前填写（pub.dev 会展示，用于溯源；缺失只会有警告）：
# repository: https://github.com/<your-org>/flutter_hot

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_js: ^0.8.7
  # 网络补丁包：http(s):// zip 下载解压（RemoteAssetLoader）
  archive: ^3.6.1
  path_provider: ^2.1.4
  # URL → 本地唯一路径哈希（sha256，避免截断碰撞）
  crypto: ^3.0.3
