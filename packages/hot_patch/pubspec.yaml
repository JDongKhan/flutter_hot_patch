name: hot_patch
description: "Flutter hot update runtime: loads build-time generated JS patch modules to render components and drive logic in JS, while rendering still happens on native Flutter."
version: 0.2.1
# 属于仓库根的 pub workspace（见根 pubspec.yaml 的 workspace 列表）。
resolution: workspace
# pub.dev 溯源信息。
repository: https://github.com/JDongKhan/flutter_hot_patch

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_js: ^0.8.7
  # 网络补丁包：http(s):// zip 下载解压（RemoteAssetLoader）
  archive: ^3.6.1
  path_provider: ^2.1.4
  # URL → 本地唯一路径哈希（sha256，避免截断碰撞）
  crypto: ^3.0.3
  # easy_refresh 能力（下拉刷新容器）的宿主桥接依赖：见
  # lib/src/js_ui/capabilities/easy_refresh/。
  easy_refresh: ^3.4.0
  # cached_network_image 能力（磁盘缓存网络图）的宿主桥接依赖：见
  # lib/src/js_ui/capabilities/cached_network_image/。
  cached_network_image: ^3.4.1
