name: hot_patch_annotations
description: 声明式注解：标记一个普通 Flutter widget 为「可动态下发的 UI 组件」。注解仅为构建期元数据，不影响组件正常运行。
version: 0.1.0
# 属于仓库根的 pub workspace（见根 pubspec.yaml 的 workspace 列表）。
resolution: workspace
# 发布前填写（pub.dev 会展示，用于溯源；缺失只会有警告）：
# repository: https://github.com/<your-org>/flutter_hot

environment:
  sdk: ^3.11.5
